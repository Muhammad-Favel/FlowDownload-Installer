[package]
name = "flowdownload-installer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Windows & macOS CLI installer for FlowDownload iOS (.ipa) over USB"

[features]
default = []
# Enable live USB + Apple ID sideloading via `isideload` and `idevice`.
sideload = ["dep:isideload", "dep:idevice"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
plist = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
zip = "2.2"

# Optional sideloading backend crates (Windows + macOS)
isideload = { version = "0.5.2", default-features = false, features = ["install", "fs-storage", "tokio-mt"], optional = true }
idevice = { version = "=0.1.61", features = ["usbmuxd"], optional = true }
